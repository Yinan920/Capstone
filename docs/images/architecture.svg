<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1090" width="1280" height="1090" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1090" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="52" font-size="27" font-weight="700" fill="#0f172a">SellerSense — System Architecture</text>
  <text x="40" y="80" font-size="14.5" fill="#475569">AI customer-feedback intelligence · single-container deployment on Google Cloud · live at https://sellersense-ai.web.app</text>

  <!-- CLIENT -->
  <rect x="40" y="108" width="460" height="88" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="137" font-size="16" font-weight="700" fill="#312e81">Seller’s browser — client tier</text>
  <text x="60" y="159" font-size="12.5" fill="#3730a3">React 18 · TypeScript · Vite · Tailwind · Recharts · Zustand</text>
  <text x="60" y="180" font-size="12.5" fill="#3730a3">Keeps the JWT in local storage; calls the API at relative /api</text>

  <line x1="270" y1="196" x2="270" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="284" y="232" font-size="12.5" fill="#334155">HTTPS · GET / · /api/*</text>

  <!-- PRODUCTION PANEL -->
  <rect x="40" y="256" width="800" height="644" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="60" y="284" font-size="12.5" font-weight="700" fill="#475569" letter-spacing="1.1">PRODUCTION · GCP PROJECT sellersense-yinan920 · us-central1</text>

  <!-- Column A: the request path -->
  <rect x="62" y="300" width="420" height="80" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="327" font-size="15" font-weight="700" fill="#7c2d12">Firebase Hosting — site “sellersense-ai”</text>
  <text x="80" y="348" font-size="12" fill="#9a3412">Global CDN edge · automatic TLS · public short URL</text>
  <text x="80" y="367" font-size="12" fill="#9a3412">Rewrites ** → the Cloud Run service (same project required)</text>

  <line x1="272" y1="380" x2="272" y2="424" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="286" y="407" font-size="12" fill="#334155">rewrite — server-side, not a redirect</text>

  <rect x="62" y="424" width="420" height="242" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="80" y="451" font-size="15" font-weight="700" fill="#1e3a8a">Cloud Run “sellersense” — application tier</text>
  <text x="80" y="471" font-size="11.5" fill="#1d4ed8">1 vCPU / 1 GiB · min 0 / max 2 · --no-cpu-throttling · scales to zero</text>

  <rect x="80" y="484" width="184" height="68" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="94" y="507" font-size="13" font-weight="700" fill="#1e40af">FastAPI backend</text>
  <text x="94" y="525" font-size="11" fill="#1d4ed8">16 routes under /api</text>
  <text x="94" y="542" font-size="11" fill="#1d4ed8">SQLAlchemy 2.0 async</text>

  <rect x="278" y="484" width="186" height="68" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="292" y="507" font-size="13" font-weight="700" fill="#1e40af">Built React SPA</text>
  <text x="292" y="525" font-size="11" fill="#1d4ed8">served from ./static</text>
  <text x="292" y="542" font-size="11" fill="#1d4ed8">SPA fallback for deep links</text>

  <rect x="80" y="562" width="384" height="76" rx="8" fill="#ffffff" stroke="#3b82f6"/>
  <text x="94" y="584" font-size="13" font-weight="700" fill="#1e40af">Analysis worker — FastAPI BackgroundTasks</text>
  <text x="94" y="603" font-size="10.8" fill="#1d4ed8">sentiment → embeddings → KMeans → labels → keywords → alerts</text>
  <text x="94" y="621" font-size="10.8" fill="#1d4ed8">writes progress 5→100; the client polls GET /api/jobs/{id}</text>

  <text x="80" y="656" font-size="11" fill="#475569">One origin for SPA + API ⇒ no CORS in production, no hostname in the bundle.</text>

  <line x1="272" y1="666" x2="272" y2="712" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="286" y="695" font-size="11.5" fill="#334155">Cloud SQL connector · IAM unix socket</text>

  <rect x="62" y="712" width="420" height="106" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="80" y="739" font-size="15" font-weight="700" fill="#065f46">Cloud SQL — PostgreSQL 16 + pgvector</text>
  <text x="80" y="760" font-size="12" fill="#047857">db-f1-micro · 10 GB HDD · automated backups · no public IP in use</text>
  <text x="80" y="780" font-size="12" fill="#047857">9 tables — users, datasets, reviews (384-dim vector),</text>
  <text x="80" y="798" font-size="12" fill="#047857">analysis_jobs, theme_clusters, keyword_stats, alerts, competitors, replies</text>

  <text x="62" y="846" font-size="11.5" fill="#64748b">Critical path: browser → CDN edge → container → database.</text>
  <text x="62" y="864" font-size="11.5" fill="#64748b">Deploy: gcloud run deploy --source . (Cloud Build)</text>
  <text x="62" y="882" font-size="11.5" fill="#64748b">Rollback: gcloud run services update-traffic --to-revisions</text>

  <!-- Column B: supporting GCP services -->
  <rect x="504" y="300" width="316" height="80" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="520" y="325" font-size="13.5" font-weight="700" fill="#7f1d1d">Secret Manager</text>
  <text x="520" y="345" font-size="11" fill="#b91c1c">database-url · jwt-secret · anthropic-api-key</text>
  <text x="520" y="363" font-size="11" fill="#b91c1c">Mounted as env vars at start — never in the image</text>

  <rect x="504" y="392" width="316" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="520" y="417" font-size="13.5" font-weight="700" fill="#4c1d95">Cloud Build + Artifact Registry</text>
  <text x="520" y="437" font-size="11" fill="#6d28d9">Builds the two-stage Dockerfile from source</text>
  <text x="520" y="455" font-size="11" fill="#6d28d9">Every build is a versioned, rollback-able image</text>

  <!-- deliberate corridor y=472..586 for the Anthropic arrow -->

  <rect x="504" y="586" width="316" height="96" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="520" y="611" font-size="13.5" font-weight="700" fill="#075985">Cloud Run Jobs — same image, other command</text>
  <text x="520" y="631" font-size="11" fill="#0369a1">sellersense-migrate → alembic upgrade head</text>
  <text x="520" y="649" font-size="11" fill="#0369a1">sellersense-seed → python -m scripts.seed</text>
  <text x="520" y="667" font-size="11" fill="#0369a1">sellersense-reset → clean demo state</text>

  <rect x="504" y="694" width="316" height="76" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/>
  <text x="520" y="719" font-size="13.5" font-weight="700" fill="#334155">IAM — dedicated runtime service account</text>
  <text x="520" y="739" font-size="11" fill="#475569">roles/cloudsql.client</text>
  <text x="520" y="757" font-size="11" fill="#475569">roles/secretmanager.secretAccessor  (nothing else)</text>

  <rect x="504" y="782" width="316" height="94" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="520" y="807" font-size="13.5" font-weight="700" fill="#78350f">Observability &amp; cost guard</text>
  <text x="520" y="827" font-size="11" fill="#92400e">Cloud Logging (stdout) · Cloud Run + SQL metrics</text>
  <text x="520" y="845" font-size="11" fill="#92400e">GET /api/health — separates “app down” from “DB down”</text>
  <text x="520" y="863" font-size="11" fill="#92400e">$25 budget alert at 50% / 90%</text>

  <!-- secrets -> cloud run (dimmed) -->
  <path d="M 504 340 L 492 340 L 492 462 L 482 462" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDim)"/>
  <!-- jobs -> cloud sql (dimmed) -->
  <path d="M 504 634 L 494 634 L 494 690 L 494 760 L 484 760" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDim)"/>

  <!-- Column C: external services -->
  <rect x="862" y="472" width="378" height="152" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="882" y="500" font-size="15" font-weight="700" fill="#4c1d95">Anthropic Claude API — external</text>
  <text x="882" y="523" font-size="12" fill="#6d28d9">claude-haiku-4-5 — batched sentiment scoring</text>
  <text x="882" y="542" font-size="11" fill="#7c3aed">25 reviews per request · 4 concurrent · JSON schema</text>
  <text x="882" y="565" font-size="12" fill="#6d28d9">claude-sonnet-5 — theme labels, summaries, replies</text>
  <text x="882" y="590" font-size="11.5" fill="#7c3aed">Chosen by config: LLM_PROVIDER = anthropic | mock</text>
  <text x="882" y="609" font-size="11.5" fill="#7c3aed">Deterministic mock adapters are the local / CI default</text>

  <!-- worker -> Anthropic, through the corridor -->
  <path d="M 482 528 L 862 528" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowAI)"/>
  <text x="596" y="518" font-size="11.5" fill="#6d28d9">HTTPS — analysis stages 1 and 4</text>

  <rect x="862" y="648" width="378" height="104" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="882" y="675" font-size="13.5" font-weight="700" fill="#334155">Embeddings — in-process, no network call</text>
  <text x="882" y="696" font-size="11" fill="#475569">384-dim vectors written to the pgvector column</text>
  <text x="882" y="714" font-size="11" fill="#475569">EMBEDDINGS_PROVIDER = mock (MD5-seeded, deterministic)</text>
  <text x="882" y="732" font-size="11" fill="#475569">or st — local sentence-transformers, optional extra</text>

  <rect x="862" y="108" width="378" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="882" y="136" font-size="13.5" font-weight="700" fill="#334155">Reading this diagram</text>
  <text x="882" y="160" font-size="11.5" fill="#475569">Solid arrow — a request on the critical path</text>
  <text x="882" y="180" font-size="11.5" fill="#475569">Dashed arrow — supporting access (secrets, one-off jobs)</text>
  <text x="882" y="200" font-size="11.5" fill="#475569">Dashed panel — a deployment environment boundary</text>
  <text x="882" y="224" font-size="11.5" fill="#475569">Purple — the only external, metered dependency</text>
  <text x="882" y="248" font-size="11.5" fill="#334155">Staging is not deployed; the local stack below plays</text>
  <text x="882" y="266" font-size="11.5" fill="#334155">that role, running the identical application code.</text>

  <!-- LOCAL DEV PANEL -->
  <rect x="40" y="922" width="1200" height="142" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="60" y="950" font-size="12.5" font-weight="700" fill="#475569" letter-spacing="1.1">LOCAL DEVELOPMENT · SAME APPLICATION CODE · THREE PROCESSES · ZERO API KEYS</text>

  <rect x="62" y="966" width="248" height="78" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="80" y="992" font-size="13" font-weight="700" fill="#312e81">Vite dev server :5173</text>
  <text x="80" y="1011" font-size="11" fill="#4338ca">npm run dev · hot reload</text>
  <text x="80" y="1029" font-size="11" fill="#4338ca">VITE_USE_MOCKS=false → real API</text>

  <line x1="310" y1="1005" x2="360" y2="1005" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="316" y="995" font-size="10.5" fill="#334155">CORS</text>

  <rect x="366" y="966" width="248" height="78" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="384" y="992" font-size="13" font-weight="700" fill="#1e3a8a">uvicorn :8000</text>
  <text x="384" y="1011" font-size="11" fill="#1d4ed8">app.main:app --reload</text>
  <text x="384" y="1029" font-size="11" fill="#1d4ed8">LLM_PROVIDER=mock — no key</text>

  <line x1="614" y1="1005" x2="664" y2="1005" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="618" y="995" font-size="10.5" fill="#334155">asyncpg</text>

  <rect x="670" y="966" width="248" height="78" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
  <text x="688" y="992" font-size="13" font-weight="700" fill="#065f46">Docker Postgres :5432</text>
  <text x="688" y="1011" font-size="11" fill="#047857">pgvector/pgvector:pg16</text>
  <text x="688" y="1029" font-size="11" fill="#047857">docker compose up -d</text>

  <rect x="962" y="966" width="256" height="78" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.4"/>
  <text x="980" y="992" font-size="13" font-weight="700" fill="#334155">Test surface</text>
  <text x="980" y="1011" font-size="11" fill="#475569">pytest 44 · Vitest 20 · Playwright E2E</text>
  <text x="980" y="1029" font-size="11" fill="#475569">smoke.sh (local) · smoke_cloud.sh (prod)</text>
</svg>
